xray_security_policies:
  - name: fstg-block-high-severity
    description: Block high and critical vulnerabilities in staging repos
    rules:
      - name: high-severity-rule
        priority: 1
        min_severity: High
        fix_version_dependant: false
        block_download_active: true
        block_download_unscanned: false
        fail_build: true
        notify_watch_recipients: true
        notify_emails:
          - alice@example.com

xray_license_policies:
  - name: fstg-block-gpl
    description: Block GPL and AGPL licensed packages in staging
    rules:
      - name: gpl-rule
        priority: 1
        banned_licenses:
          - GPL-3.0
          - AGPL-3.0
        allow_unknown: false
        block_download_active: false
        fail_build: false
        notify_emails:
          - alice@example.com

xray_operational_risk_policies:
  - name: fstg-eol-packages
    description: Notify on high operational risk packages
    rules:
      - name: eol-rule
        priority: 1
        op_risk_min_risk: High
        block_download_active: false
        fail_build: false
        notify_emails:
          - alice@example.com

oidc_configurations:
  - name: fstg-github-actions
    description: GitHub Actions OIDC for fstg
    issuer_url: https://token.actions.githubusercontent.com
    provider_type: GitHub
    organization: Fortescue
    audience: jfrog-fstg

# Maps an oidc_configurations entry's claims onto a JFrog token scope.
# provider_name above must match an oidc_configurations "name". This one has
# no "roles:<project key>:" scope, so it stays global — see
# projects/fstg.yaml for a project-scoped mapping instead.
oidc_identity_mappings:
  - name: fstg-github-actions-readers
    description: Read-only access for fstg's GitHub Actions
    provider_name: fstg-github-actions
    priority: 10
    claims:
      sub: "repo:Fortescue/fstg-deploy:ref:refs/heads/main"
    token_spec:
      scope: 'applied-permissions/groups:"fstg-readers"'
      audience: "jfrt@*"
      expires_in: 3600

