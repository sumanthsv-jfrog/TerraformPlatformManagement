curation_conditions:
  - name: fstg-high-cvss
    template_id: CVECVSSRange
    params:
      - param_id: vulnerability_cvss_score_range
        value: [7.0, 10.0]
      - param_id: apply_only_if_fix_is_available
        value: true
      - param_id: do_not_apply_for_already_existing_vulnerabilities
        value: false

curation_policies:
  - name: fstg-block-malicious
    condition_id: "1"
    scope: specific_repos
    repo_include:
      - npm-remote
    policy_action: block
    waiver_request_config: forbidden

