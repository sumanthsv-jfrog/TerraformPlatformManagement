# Platform-wide JFrog objects: the JFrog projects themselves, groups,
# permissions, Xray policies and watches, and curation. A project declared
# here is created even if no file under projects/ manages it. A file under
# projects/<name>.yaml attaches that project's custom roles and repository
# assignments by referencing its key — see projects/fstg.yaml.
#
# Users and groups are owned by SCIM. The entries below are the ones
# Terraform already manages from the old environments/staging.yaml.
# Do not add new users or groups here, and do not assign them to a project
# role here either — provision and assign people through SCIM.

# Repositories not owned by any one project. A repository a project does
# own belongs in that project's own file under projects/ instead, named
# "<project key>-...".
repositories:
  - name: check-libs-release-local2
    package_type: maven
    repo_type: local
    description: Staging Maven local repository
    xray_index: true

  - name: check-libs-release-local4
    package_type: maven
    repo_type: local
    description: Staging Maven local repository
    xray_index: true

projects:
  - key: fstg
    display_name: Fortescue Staging
    description: Staging project for fstg repositories
    email_notification: true
    admin_privileges:
      manage_members: true
      manage_resources: true
      manage_remote_repository: true
      index_resources: true


  - key: cba
    display_name: cba Staging
    description: Staging project for cba repositories
    email_notification: true
    admin_privileges:
      manage_members: true
      manage_resources: true
      manage_remote_repository: true
      index_resources: true



groups:
  - name: fstg-developers
    description: Staging developers

  - name: fstg-readers
    description: Staging read-only users

users:
  - name: fstg-alice
    email: alice@example.com
    password: ChangeMe#123!
    disable_ui_access: false
    groups:
      - fstg-developers

