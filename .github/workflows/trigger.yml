name: "Terraform Plan via OIDC"

on: workflow_dispatch

permissions:
  id-token: write # Required for GitHub OIDC token generation
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.TF_STATE_REGION }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Exchange the GitHub OIDC token for a short-lived JFrog access token.
      # oidc-provider-name and oidc-audience must match the JFrog OIDC integration.
      - name: Setup JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://psblr.jfrog.io
        with:
          oidc-provider-name: cba-github-oidc
          oidc-audience: cba-github-oidc

      - name: Verify JFrog OIDC
        run: jf rt ping

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Providers read JFROG_ACCESS_TOKEN. The CLI action exposes that token
      # as the oidc-token output; it does not export JFROG_ACCESS_TOKEN itself.
      - name: Terraform Init
        env:
          JFROG_ACCESS_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}"

      - name: Terraform Plan
        env:
          JFROG_ACCESS_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: terraform plan -input=false
